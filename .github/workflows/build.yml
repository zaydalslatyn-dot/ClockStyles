name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        if: hashFiles('project.zip') != ''
        run: |
          rm -rf src_project
          mkdir src_project
          unzip -q project.zip -d src_project
      - name: Build
        if: hashFiles('project.zip') != ''
        working-directory: src_project
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: hashFiles('project.zip') != ''
        with:
          name: ClockStyles-apk
          path: src_project/app/build/outputs/apk/debug/*.apk
